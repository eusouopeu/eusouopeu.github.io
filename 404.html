<body>
    <script>
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('theme'); } catch (e) {}
            var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (!dark) document.body.classList.add('light-theme');
        })();
    </script>
    <main class="relative min-h-screen flex items-center justify-center text-center px-4 overflow-hidden">
        <div class="azulejo-field" aria-hidden="true"></div>
        <div class="relative max-w-xl mx-auto">
            <p class="eyebrow text-dim mb-6">ERRO 404 · NOT FOUND</p>
            <h1 class="text-4xl sm:text-5xl font-display font-semibold mb-4 leading-tight">Esta página <span class="gradient-text">não existe</span></h1>
            <p class="text-lg text-dim mb-2">O link pode estar desatualizado ou ter sido digitado errado.</p>
            <p class="text-sm text-dim mb-10" lang="en">This page doesn't exist — the link may be outdated or mistyped.</p>
            <a href="/" class="btn-primary font-semibold py-3 px-8 rounded-lg text-base inline-block">Voltar ao portfólio · Back to portfolio</a>
        </div>
    </main>
</body>
